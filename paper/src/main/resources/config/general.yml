# config.yml wird beim ersten Start übernommen und danach als Altbestand erhalten.
claims:
  pro-spieler: 3
# Ohne Weltangabe außerhalb einer Plotwelt gilt diese Welt. Namen entsprechen worlds/<Name>.yml.
welten:
  standard: plots
# In LuckPerms z. B. simpleplots.rang.moderator vergeben. Explizite Einzelrechte gelten weiter.
# Eigene Gruppen sind erlaubt. Bündel dürfen keine anderen Bündel enthalten.
rang-buendel:
  spieler: [simpleplots.use, simpleplots.claim, simpleplots.manage, simpleplots.fly]
  supporter: [simpleplots.use, simpleplots.admin.list, simpleplots.admin.inspect, simpleplots.admin.visit]
  moderator: [simpleplots.use, simpleplots.admin.list, simpleplots.admin.inspect, simpleplots.admin.visit, simpleplots.admin.role, simpleplots.admin.profile, simpleplots.admin.censor, simpleplots.admin.diagnostics]
  admin: [simpleplots.admin]
funktionen:
  galerie: true
  zusammenlegen: true
  uebertragen: true
  biome: true
uebertragung:
  gueltigkeit-sekunden: 120
# Obergrenzen des Datenmodells: Name 32, Beschreibung 120 Zeichen.
profil:
  name-laenge: 32
  beschreibung-laenge: 120
# Bindet EconomySystem direkt an (ohne Vault). Der Preis gilt je beanspruchter Rasterzelle.
# /plot claim und /plot auto buchen ihn ab; Claims der Verwaltung bleiben kostenlos.
# plugin nennt das Bukkit-Plugin, zeitlimit-millis begrenzt den Zugriff auf dessen Speicher.
wirtschaft:
  aktiv: false
  plugin: 'EconomySystem'
  preis: '250.00'
  zeitlimit-millis: 5000

betreten:
  # actionbar zeigt Plotname und Besitzer über der Hotbar; title nutzt den großen Bildschirmtitel.
  anzeige: actionbar
  # Bestehender Hauptschalter für die Plot-Anzeige. Zeiten gelten nur für title.
  # Zensurhinweise werden unabhängig davon angezeigt.
  titel: true
  einblenden-millis: 250
  anzeigen-millis: 2000
  ausblenden-millis: 500
