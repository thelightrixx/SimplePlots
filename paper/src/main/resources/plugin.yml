name: SimplePlots
version: '${project.version}'
main: de.lightrixx.plot.paper.SimplePlots
api-version: '${api.version}'
folia-supported: false
softdepend: [EconomySystem]
description: Mehrere Plotwelten mit Claims, Rollen, Flugregeln und Moderation.
commands:
  simpleplots:
    description: Betritt die Plotwelt oder verwalte deine Plots.
    usage: /simpleplots help
    aliases: [plot, p]
permissions:
  simpleplots.help: { description: Erlaubte Befehle und ihre Verwendung anzeigen., default: true }
  simpleplots.version: { description: Installierte Plugin-Version anzeigen., default: true }
  simpleplots.reload: { description: Konfiguration nach vollständiger Prüfung neu laden., default: op }
  simpleplots.diagnostics: { description: Betriebszustand prüfen., default: op }
  simpleplots.update: { description: Updates prüfen und bestätigt für den nächsten Start vorbereiten., default: op }
  simpleplots.bookmark:
    description: Persönliche Plot-Lesezeichen verwalten und besuchen.
    default: true
  simpleplots.border:
    description: Die Plotgrenze vorübergehend als private Partikel sehen.
    default: true
  simpleplots.use:
    description: Basisrecht für /simpleplots.
    default: true
  simpleplots.claim:
    description: Eigene Plots beanspruchen.
    default: true
  simpleplots.manage:
    description: Rechte und Zutritt auf den eigenen Plots verwalten.
    default: true
  simpleplots.admin:
    description: Plotwelt administrieren, alle Spielmodi nutzen und überall in der Plotwelt fliegen.
    default: op
    children:
      simpleplots.update: true
      simpleplots.diagnostics: true
      simpleplots.reload: true
      simpleplots.version: true
      simpleplots.help: true
      simpleplots.use: true
      simpleplots.claim: true
      simpleplots.manage: true
      simpleplots.fly: true
      simpleplots.admin.update: true
      simpleplots.admin.list: true
      simpleplots.admin.inspect: true
      simpleplots.admin.visit: true
      simpleplots.admin.claim: true
      simpleplots.admin.unclaim: true
      simpleplots.admin.setowner: true
      simpleplots.admin.role: true
      simpleplots.admin.profile: true
      simpleplots.admin.censor: true
      simpleplots.admin.remove: true
      simpleplots.admin.restore: true
      simpleplots.admin.setup: true
      simpleplots.admin.contest: true
      simpleplots.admin.reload: true
      simpleplots.admin.diagnostics: true
  simpleplots.admin.reload:
    description: Einstellungen, Nachrichten und Menüs sicher neu laden.
    default: op
    children:
      simpleplots.reload: true
      simpleplots.use: true
  simpleplots.fly:
    description: Fly auf eigenen Plots innerhalb der konfigurierten Höhe einschalten.
    default: true
  simpleplots.admin.update:
    description: GitHub-Updates prüfen und für den nächsten Start vorbereiten.
    default: op
    children:
      simpleplots.update: true
  simpleplots.admin.bypass:
    description: Admin-Bypass für Baurechte und Banns schalten.
    default: false
  simpleplots.admin.list:
    description: Plots eines Besitzers auflisten.
    default: op
  simpleplots.admin.inspect:
    description: Besitzer, Rasterzellen und Zensurstatus prüfen.
    default: op
  simpleplots.admin.visit:
    description: Zum öffentlichen Weg vor einem Plot reisen.
    default: op
  simpleplots.admin.claim:
    description: Freie Plots unabhängig vom Claim-Limit zuweisen.
    default: op
  simpleplots.admin.unclaim:
    description: Claims ohne Löschung der Bauten freigeben.
    default: op
  simpleplots.admin.setowner:
    description: Besitzer nach expliziter Bestätigung direkt ändern.
    default: op
  simpleplots.admin.role:
    description: Rollen und Banns fremder Plots verwalten.
    default: op
  simpleplots.admin.profile:
    description: Profile fremder Plots bearbeiten.
    default: op
  simpleplots.admin.censor:
    description: Inhalte von Plots reversibel ausblenden und sperren.
    default: op
  simpleplots.admin.contest:
    description: Wettbewerbe verwalten.
    default: op
  simpleplots.admin.remove:
    description: Plotflächen samt Besitz und Inhalt vollständig ins Leere entfernen und sperren.
    default: op
  simpleplots.admin.restore:
    description: Entfernte Flächen als freie Standardplots ohne bisherigen Inhalt wiederherstellen.
    default: op
  simpleplots.admin.setup:
    description: Konfigurationen aller registrierten Plotwelten prüfen.
    default: op
  simpleplots.admin.diagnostics:
    description: Version, Plotwelt und Speicherwarteschlange prüfen.
    default: op
    children:
      simpleplots.diagnostics: true
      simpleplots.use: true

authors: [lightrixx]
website: https://thelightrixx.github.io/SimplePlots/
