name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version, Dokumentation und Changelog prüfen
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(python3 scripts/check-version.py --tag "$GITHUB_REF_NAME")
          else
            version=$(python3 scripts/check-version.py)
          fi
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Mit Tests bauen
        run: mvn -B -ntp -pl paper -am clean verify

      - name: Plugin-JAR und Prüfsumme bereitstellen
        shell: bash
        run: |
          python3 scripts/check-version.py --jar
          jar="SimplePlots-${PLUGIN_VERSION}.jar"
          mkdir -p dist
          cp "paper/target/$jar" "dist/$jar"
          (cd dist && sha256sum "$jar" > SHA256SUMS.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simpleplots-paper
          path: |
            dist/SimplePlots-*.jar
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: simpleplots-paper
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/SimplePlots-*.jar
            dist/SHA256SUMS.txt
